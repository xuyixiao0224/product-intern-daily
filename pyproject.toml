[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-intern-daily"
version = "0.1.0"
description = "Daily, verified and deduplicated product-internship leads."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [{name = "product-intern-daily contributors"}]
dependencies = []

[project.optional-dependencies]
ocr = ["ocrmac>=1.0.1", "pillow>=10"]

[project.scripts]
product-intern-daily = "product_intern_daily.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
product_intern_daily = ["prompts/*.md"]
