name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - run: python scripts/validate_data.py data/jobs.example.json
      - run: python scripts/generate_readme.py data/jobs.example.json docs/JOBS.md
      - run: python scripts/build_site.py data/jobs.example.json docs/index.html
      - run: python scripts/build_feed.py data/jobs.example.json docs/feed.xml "https://example.github.io/product-intern-daily/"
